<!DOCTYPE html>
<html>
<head><title>State Space Minimal Test</title></head>
<body style="margin:0;background:#111">
<canvas id="c" width="256" height="256" style="width:512px;height:512px;image-rendering:pixelated"></canvas>
<div id="info" style="color:#fff;font-family:monospace;padding:8px">Loading...</div>
<script type="module">
// Minimal test: just gravity kernel + render, 256x256
import { BITMASK_DEFS, LOCKED_1A, GRAVITY_SHADER, RENDER_SHADER } from './shaders.js';

const W = 256, H = 256, N = W * H;

function packVoxel(mat, thermal, kx, ky, phase, flags) {
    return (mat&0xFF)|((thermal&0xFF)<<8)|((kx&0xF)<<16)|((ky&0xF)<<20)|((phase&0xF)<<24)|((flags&0xF)<<28);
}

async function main() {
    const info = document.getElementById('info');
    info.textContent = 'Requesting GPU...';

    const adapter = await navigator.gpu.requestAdapter();
    const device = await adapter.requestDevice();
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('webgpu');
    const format = navigator.gpu.getPreferredCanvasFormat();
    ctx.configure({ device, format, alphaMode: 'opaque' });

    info.textContent = 'Creating buffers...';

    // Initial grid: air + stone floor + some sand
    const grid = new Uint32Array(N);
    grid.fill(packVoxel(0, 20, 0, 0, 4, 0)); // air
    for (let x = 0; x < W; x++)
        for (let y = H-20; y < H; y++)
            grid[y*W+x] = packVoxel(1, 20, 0, 0, 0, 0); // stone floor
    // Sand pile
    for (let x = 100; x < 156; x++)
        for (let y = 50; y < 80; y++)
            grid[y*W+x] = packVoxel(3, 20, 0, 0, 1, 0); // sand

    const gridA = device.createBuffer({ size: N*4, usage: GPUBufferUsage.STORAGE|GPUBufferUsage.COPY_DST });
    const gridB = device.createBuffer({ size: N*4, usage: GPUBufferUsage.STORAGE });
    device.queue.writeBuffer(gridA, 0, grid);

    // Cold table (minimal, just density for gravity)
    const coldTable = new Uint32Array(256 * 24);
    coldTable[0*24+0] = 1;   // air density=1
    coldTable[1*24+0] = 200; // stone density=200
    coldTable[3*24+0] = 180; // sand density=180
    const coldBuf = device.createBuffer({ size: coldTable.byteLength, usage: GPUBufferUsage.STORAGE|GPUBufferUsage.COPY_DST });
    device.queue.writeBuffer(coldBuf, 0, coldTable);

    const paramBuf = device.createBuffer({ size: 16, usage: GPUBufferUsage.UNIFORM|GPUBufferUsage.COPY_DST });
    device.queue.writeBuffer(paramBuf, 0, new Uint32Array([W, H, 0, 0]));

    info.textContent = 'Compiling shaders...';

    // Just gravity compute
    const gravityCode = BITMASK_DEFS + '\n' + LOCKED_1A + '\n' + GRAVITY_SHADER;
    const gravityModule = device.createShaderModule({ code: gravityCode });

    const computeBGL = device.createBindGroupLayout({ entries: [
        { binding:0, visibility:GPUShaderStage.COMPUTE, buffer:{type:'read-only-storage'} },
        { binding:1, visibility:GPUShaderStage.COMPUTE, buffer:{type:'storage'} },
        { binding:2, visibility:GPUShaderStage.COMPUTE, buffer:{type:'read-only-storage'} },
    ]});
    const computePipeline = device.createComputePipeline({
        layout: device.createPipelineLayout({bindGroupLayouts:[computeBGL]}),
        compute: { module: gravityModule, entryPoint: 'tick' },
    });
    const bgAB = device.createBindGroup({ layout:computeBGL, entries:[
        {binding:0,resource:{buffer:gridA}},{binding:1,resource:{buffer:gridB}},{binding:2,resource:{buffer:coldBuf}},
    ]});
    const bgBA = device.createBindGroup({ layout:computeBGL, entries:[
        {binding:0,resource:{buffer:gridB}},{binding:1,resource:{buffer:gridA}},{binding:2,resource:{buffer:coldBuf}},
    ]});

    // Render
    const renderModule = device.createShaderModule({ code: RENDER_SHADER });
    const renderBGL = device.createBindGroupLayout({ entries: [
        { binding:0, visibility:GPUShaderStage.FRAGMENT, buffer:{type:'read-only-storage'} },
        { binding:1, visibility:GPUShaderStage.FRAGMENT, buffer:{type:'uniform'} },
    ]});
    const renderPipeline = device.createRenderPipeline({
        layout: device.createPipelineLayout({bindGroupLayouts:[renderBGL]}),
        vertex: { module: renderModule, entryPoint: 'vs_main' },
        fragment: { module: renderModule, entryPoint: 'fs_main', targets:[{format}] },
        primitive: { topology: 'triangle-strip' },
    });
    const renderBGA = device.createBindGroup({ layout:renderBGL, entries:[
        {binding:0,resource:{buffer:gridA}},{binding:1,resource:{buffer:paramBuf}},
    ]});
    const renderBGB = device.createBindGroup({ layout:renderBGL, entries:[
        {binding:0,resource:{buffer:gridB}},{binding:1,resource:{buffer:paramBuf}},
    ]});

    info.textContent = 'Running...';
    let tick = 0, isA = true;
    const wgX = Math.ceil(W/16), wgY = Math.ceil(H/16);

    function frame() {
        const enc = device.createCommandEncoder();
        // Compute
        const cp = enc.beginComputePass();
        cp.setPipeline(computePipeline);
        cp.setBindGroup(0, isA ? bgAB : bgBA);
        cp.dispatchWorkgroups(wgX, wgY);
        cp.end();
        isA = !isA;
        // Render
        const rp = enc.beginRenderPass({ colorAttachments:[{
            view: ctx.getCurrentTexture().createView(),
            loadOp:'clear', storeOp:'store', clearValue:{r:0,g:0,b:0,a:1},
        }]});
        rp.setPipeline(renderPipeline);
        rp.setBindGroup(0, isA ? renderBGA : renderBGB);
        rp.draw(4);
        rp.end();
        device.queue.submit([enc.finish()]);
        tick++;
        info.textContent = 'Tick: ' + tick;
        requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
}
main().catch(e => { document.getElementById('info').textContent = 'Error: ' + e.message; console.error(e); });
</script>
</body>
</html>
