name: PR 122 hosted negative controls
on:
  push:
    branches: ['review/pr122-profile-controls-5f1811ca']
permissions:
  contents: read
jobs:
  controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 5f1811caa0dd82f3dd05a1ebf85abd4644f0441c
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.22.3'
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.11.28'
      - run: uv sync --locked
      - run: npm ci
      - name: Verify rejection of a wrong tick hash, report-only drift and a stale label hook
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "5f1811caa0dd82f3dd05a1ebf85abd4644f0441c"
          mkdir -p "$PWD/control-results/home"
          cat > control-results/test.py <<'PY'
          from pathlib import Path
          import json, os, shutil, subprocess
          root = Path.cwd()
          out = root / 'control-results'
          node = shutil.which('node')
          parent = [node, 'scripts/profile_world_ticks.mjs']
          def check(name, args, marker):
              p = subprocess.run([str(root/'.venv/bin/python'), '-B', '-m', 'scripts.verification_guard', '--kind', 'cpu', '--timeout', '140', '--stall', '80', '--', *args], stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
              (out/(name+'.log')).write_text(p.stdout)
              assert p.returncode != 0 and marker in p.stdout, (name, p.returncode, p.stdout[-2200:])
              print('PASS', name, flush=True)
          gold = Path('engine/experimental/multiphysics/liquid-contact-freeze.json')
          orig = gold.read_bytes()
          g = json.loads(orig)
          steps = g['cases']['control-timed-cup-4']['steps']
          assert steps[0] == 'cd3999c539126e1f 58863'
          steps[0] = '0000000000000000 58863'
          try:
              gold.write_text(json.dumps(g))
              check('intermediate-digest', parent, '0000000000000000 58863')
          finally:
              gold.write_bytes(orig)
          [summary] = Path('dist/verification/world-tick-profile').glob('*/summary.json')
          assert json.loads(summary.read_text())['status'] == 'failed'
          bundles = out/'inputs'
          bundles.mkdir()
          for name in ['public','catalogue','diagnostic']:
              shutil.copyfile(summary.parent/(name+'.mjs'), bundles/(name+'.mjs'))
          (bundles/'diagnostic.mjs').rename(bundles/'original.mjs')
          (bundles/'diagnostic.mjs').write_text("""
          import * as real from './original.mjs';
          export * from './original.mjs';
          export function createMultiphysicsTickJob3D(...args) {
            const job = real.createMultiphysicsTickJob3D(...args);
            return {...job, result() {
              const value = job.result();
              value.report.contacts += 1;
              return value;
            }};
          }
          """)
          check('report-only', [node,'--single-threaded','scripts/profile_world_ticks.mjs','--child',str(bundles),'control-timed-cup-4'], 'full tick or report changed')
          assert not (bundles/'control-timed-cup-4.json').exists()
          hook = Path('engine/experimental/multiphysics/world-tick.ts')
          orig = hook.read_bytes()
          old = b"yield 'fluid-coupling';"
          assert orig.count(old) == 1
          try:
              hook.write_bytes(orig.replace(old, b"yield ('fluid-coupling');"))
              check('stale-stage-hook', parent, 'world-tick.ts diagnostic hook changed')
          finally:
              hook.write_bytes(orig)
          assert subprocess.run(['git','diff','--exit-code'], stdout=subprocess.DEVNULL).returncode == 0
          (out/'result.json').write_text(json.dumps({'revision':'5f1811caa0dd82f3dd05a1ebf85abd4644f0441c','controls':['intermediate-digest','report-only','stale-stage-hook'],'restored':True}))
          PY
          sudo systemd-run --quiet --wait --pipe --collect --uid="$(id -u)" --gid="$(id -g)" \
            -p PrivateNetwork=yes -p PrivateTmp=yes -p ProtectSystem=strict \
            -p NoNewPrivileges=yes -p "ReadWritePaths=$PWD" --working-directory="$PWD" \
            /usr/bin/env -i "PATH=$PATH" "HOME=$PWD/control-results/home" LANG=C.UTF-8 /usr/bin/python3 -B control-results/test.py
      - name: Retain control logs and supervisor receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: controls-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            control-results/*.log
            control-results/result.json
            dist/verification/*/report.json
            dist/verification/world-tick-profile/*/summary.json
