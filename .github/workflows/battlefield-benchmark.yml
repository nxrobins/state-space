name: Battlefield benchmark
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/battlefield-benchmark.yml'
      - 'scripts/battlefield/**'
      - 'scripts/commanded_crossing_turn.mjs'
      - 'scripts/crossing_reference.mjs'
      - 'scripts/crossing_order_replay.mjs'
      - 'scripts/moving_crossing_scene.mjs'
      - 'scripts/liquid_contact_engine.mjs'
      - 'scripts/verification*'
      - 'scripts/verify_macos_qualification.py'
      - 'examples/crossing-mission/**'
      - 'engine/**'
      - 'scripts/build_sdk.mjs'
      - 'package*.json'
permissions:
  contents: read
jobs:
  crossing:
    name: Four-tick preview latency and frozen crossing replay (hosted CPU)
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.22.3'
          cache: npm
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.11.28'
      - run: uv sync --locked
      - run: npm ci
      - run: npm run build:sdk
      - run: uv run python -B -m scripts.verification_guard --kind cpu --timeout 300 --stall 100 -- node scripts/battlefield/capture.mjs
      - name: Retain timings, source-bound native packet and supervisor evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: battlefield-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/verification/
          retention-days: 14
          if-no-files-found: error
