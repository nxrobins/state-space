name: Engine verification
on:
  pull_request:
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: engine-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cpu:
    name: Bounded CPU and package checks
    # Public-repository Ubuntu runners provide 16 GB; the existing supervisor
    # refuses launch below 8 GiB available memory. GPU checks are separate.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.11.28'
          enable-cache: true
      - run: uv sync --locked
      - run: npm ci
      - name: Build, types and lint
        run: |
          npm run build:sdk
          npm run build:reactive-chamber
          npm run typecheck
          npm run lint
          npm run format:check
          uv run ruff check .
      - name: Bounded CPU smoke
        run: node scripts/verify_checks.mjs --suite smoke
      - name: CPU unit and controller suite
        run: node scripts/verify_checks.mjs --suite unit
      - name: Supervisor regressions (no GPU)
        run: uv run python -B -m scripts.verification_guard --kind cpu --timeout 60 -- .venv/bin/python -B -m unittest discover -s tests -p 'test_verification*.py' -v
      - name: Archive restoration regressions
        run: uv run python -B -m scripts.verification_guard --kind cpu --timeout 30 -- .venv/bin/python -B -m unittest tests.test_evidence_archive -v
      - name: Installed CPU package client
        run: uv run python -m scripts.verify_packages
      - name: Floor interpreter import check
        # Development and CI use the interpreter in .python-version; the package
        # still declares requires-python >= 3.10, so the floor must keep importing.
        run: uv run --isolated --locked --python 3.10 python -c "import engine, eval.evaluator; print('floor ok')"
      - name: Retain receipts and failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cpu-evidence-${{ github.sha }}
          path: |
            dist/verification/
            dist/packages/*.whl
            dist/packages/*.tgz
          retention-days: 14
          if-no-files-found: warn
