name: Two-unit crossing
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/two-unit-crossing.yml'
      - 'scripts/verify_two_unit_crossing.mjs'
      - 'scripts/commanded_crossing_turn.mjs'
      - 'scripts/moving_crossing_scene.mjs'
      - 'scripts/crossing_reference.mjs'
      - 'scripts/crossing_order_replay.mjs'
      - 'scripts/crossing_checkpoint.mjs'
      - 'scripts/liquid_contact_engine.mjs'
      - 'engine/**'
      - 'scripts/verification_guard.*'
      - 'package-lock.json'
permissions:
  contents: read
jobs:
  profile:
    name: Two-unit preview, commit and exact replay (CPU)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.22.3'
          cache: npm
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.11.28'
          enable-cache: true
      - run: uv sync --locked
      - run: npm ci
      - name: Preview crossing orders, commit and replay from saves
        run: uv run python -B -m scripts.verification_guard --kind cpu --timeout 600 --stall 150 -- node scripts/verify_two_unit_crossing.mjs
      - name: Retain crossing trajectories and replay evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: two-unit-crossing-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/verification/
          retention-days: 14
          if-no-files-found: error
