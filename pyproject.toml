[project]
name = "state-space"
version = "0.4.0"
description = "Deterministic GPU material simulation with explicit energy accounting"
requires-python = ">=3.10"
dependencies = [
    "wgpu>=0.31,<0.32",
    "numpy>=1.24.0",
    "wasmtime>=50.0.1,<51",
]

[project.optional-dependencies]
evolution = ["anthropic>=1.15.0"]
viewer = ["glfw"]

[tool.hatch.build.targets.wheel]
packages = ["engine", "eval"]
exclude = ["**/*.ts", "**/*.mjs", "**/tsconfig*.json", "**/node_modules/**"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py310"
include = ["engine/**/*.py", "eval/**/*.py", "tests/**/*.py", "scripts/verify*.py", "scripts/verification*.py", "scripts/benchmark*.py", "scripts/build_structure_solver.py", "examples/sdk/*.py", "evolve_ss.py", "test_*.py", "verify_gpu.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# These supervisor modules, qualification scripts and supervisor tests use a
# compact one-line style. The exemption is explicit here so `ruff check .` is
# the configured rule and CI runs exactly that command.
"scripts/verification_journal.py" = ["E701", "E702"]
"scripts/verify_active_cavern_ui.py" = ["E701", "E702"]
"scripts/verify_cavern_ui.py" = ["E701", "E702"]
"scripts/verify_volume_m4_browser.py" = ["E701", "E702"]
"scripts/verify_volume_m5_browser.py" = ["E701", "E702"]
"tests/test_verification_browser.py" = ["E701", "E702"]
"tests/test_verification_guard.py" = ["E701", "E702"]
"tests/test_verification_journal.py" = ["E701", "E702"]
"tests/test_volume_latency_report.py" = ["E701", "E702"]

[dependency-groups]
dev = [
    "psutil>=7,<8",
    "ruff>=0.17.1",
]
